name: CI

# MANUAL DISPATCH ONLY (#989). CI does **not** run on push or pull_request — it runs
# when someone asks it to:
#
#     gh workflow run ci.yml --ref <branch>          # dispatch
#     gh run list --workflow=ci.yml --limit 1        # find it
#     gh run watch <run-id>                          # follow it
#
# Why: GitHub-hosted runner minutes. A self-hosted runner is the intended long-term fix,
# after which this reverts to `push: [main]` + `pull_request` — a one-line change.
#
# ⚠️ CONSEQUENCE, and it is not small: the local gate matrix in CLAUDE.md / AGENTS.md /
# GEMINI.md is no longer a redundant pre-check with CI as the backstop. **It is now the
# primary verification.** Nothing runs automatically to catch a matrix that was skipped,
# run with narrower features, or piped (which masks the exit code — trap #1 = false green).
# Those files say so explicitly; keep them in sync if this trigger changes.
on:
  workflow_dispatch:

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs (intra-doc links)
    runs-on: ubuntu-latest
    # Deny broken AND public->private intra-doc links. `cargo test --doc` does not
    # catch broken *links* (only failing doc examples), so this is a distinct gate.
    # Scoped to the `memory-engine` core crate for now; the cli/mcp/embed crates
    # still carry residual broken links (tracked separately) before the gate can
    # widen to `--workspace`.
    env:
      RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (default features)
        run: cargo doc --no-deps -p memory-engine
      - name: cargo doc (all features)
        run: cargo doc --no-deps -p memory-engine --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (default features)
        run: cargo build --workspace
      - name: cargo build (all features)
        run: cargo build --workspace --all-features
      # Facade-alone resolutions. NOT redundant with the --workspace builds above: since
      # Wave 2 #816 / S4, `me-archive` is an unconditional workspace member that depends on
      # `me-types`/`me-storage`/`me-index` with `features = ["archive"]`. Cargo unifies
      # features across a `--workspace` build, so those three crates now compile with
      # `archive` ON in EVERY workspace job — including the "default features" one. Without
      # the checks below, **no CI job would compile them archive-OFF**, which is precisely
      # the configuration a downstream consumer of `memory-engine` resolves to by default.
      # `-p` narrows the graph to the facade, excluding `me-archive` and restoring that gate.
      - name: cargo check (facade alone, default features — the true archive-OFF gate)
        run: cargo check -p memory-engine
      - name: cargo check (facade alone, no default features)
        run: cargo check -p memory-engine --no-default-features --features backend-sqlite

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (all features)
        run: cargo test --workspace --all-features

  fuzz:
    name: Fuzz build (#993)
    runs-on: ubuntu-latest
    # The detached `fuzz/` workspace (empty `[workspace]`) consumes the facade public API
    # by path, but NO `--workspace` job compiles it — it needs nightly + the libFuzzer
    # sanitizer runtime. This is the only gate that catches a facade API removal/rename
    # breaking a real in-repo consumer. Mirrors `cargo +nightly fuzz build` in the local
    # gate matrix (CLAUDE.md / AGENTS.md / GEMINI.md / qa-sweep). See #993.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The detached `fuzz/` workspace builds into `fuzz/target`, which rust-cache's default
      # (`. -> target`) does NOT cover — cache it explicitly. Caveat: `@nightly` moves daily and
      # rust-cache keys on the rustc commit, so this warms repeated dispatches on the SAME
      # nightly, not across days — still worth it given the #989 runner-minute motive.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: cargo +nightly fuzz build
        run: cargo +nightly fuzz build

  cargo-deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs `cargo deny check` against deny.toml: RustSec advisories (the gate),
      # license allow-list, duplicate-version visibility, and source allow-list.
      # Config (incl. the all-features graph) lives in deny.toml at the repo root.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: MSRV (verify rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Source the MSRV from the manifest so this job can never drift from the
      # declared `rust-version`. The value is format-validated before use, which
      # also neutralises any injection via a fork PR's Cargo.toml.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/')
          if ! printf '%s' "$msrv" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not parse a valid rust-version from Cargo.toml (got '$msrv')"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $msrv"
      # @v1 is the action's stable release tag (pinned, not the moving @master);
      # the dynamic `toolchain:` input is what selects the version to install.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Compile the whole workspace on exactly the declared MSRV — including tests
      # and examples (so a dev-dep or test-only feature that needs a newer Rust is
      # caught, not just library code) — for both default and all-features configs.
      - name: cargo build (MSRV, default features)
        run: cargo build --workspace --tests --examples
      - name: cargo build (MSRV, all features)
        run: cargo build --workspace --all-features --tests --examples
