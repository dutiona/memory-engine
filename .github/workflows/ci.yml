name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs (intra-doc links)
    runs-on: ubuntu-latest
    # Deny broken AND public->private intra-doc links. `cargo test --doc` does not
    # catch broken *links* (only failing doc examples), so this is a distinct gate.
    # Scoped to the `memory-engine` core crate for now; the cli/mcp/embed crates
    # still carry residual broken links (tracked separately) before the gate can
    # widen to `--workspace`.
    env:
      RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (default features)
        run: cargo doc --no-deps -p memory-engine
      - name: cargo doc (all features)
        run: cargo doc --no-deps -p memory-engine --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (default features)
        run: cargo build --workspace
      - name: cargo build (all features)
        run: cargo build --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (all features)
        run: cargo test --workspace --all-features

  cargo-deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs `cargo deny check` against deny.toml: RustSec advisories (the gate),
      # license allow-list, duplicate-version visibility, and source allow-list.
      # Config (incl. the all-features graph) lives in deny.toml at the repo root.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: MSRV (verify rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Source the MSRV from the manifest so this job can never drift from the
      # declared `rust-version`. The value is format-validated before use, which
      # also neutralises any injection via a fork PR's Cargo.toml.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/')
          if ! printf '%s' "$msrv" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not parse a valid rust-version from Cargo.toml (got '$msrv')"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $msrv"
      # @v1 is the action's stable release tag (pinned, not the moving @master);
      # the dynamic `toolchain:` input is what selects the version to install.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Compile the whole workspace on exactly the declared MSRV — including tests
      # and examples (so a dev-dep or test-only feature that needs a newer Rust is
      # caught, not just library code) — for both default and all-features configs.
      - name: cargo build (MSRV, default features)
        run: cargo build --workspace --tests --examples
      - name: cargo build (MSRV, all features)
        run: cargo build --workspace --all-features --tests --examples
