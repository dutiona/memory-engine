[package]
name = "memory-engine-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CLI inspector for memory-engine — operator tool for querying, inspecting, and managing agent memory"
license = "MIT OR Apache-2.0"

[[bin]]
name = "memory-engine-cli"
path = "src/main.rs"

[dependencies]
memory-engine = { path = "..", features = ["compress-gzip", "compress-zstd"] }
memory-engine-embed = { path = "../memory-engine-embed" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
tabled = "0.20"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled-full"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
