[package]
name = "memory-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Embedded memory engine for autonomous AI agents — hybrid search, bi-temporal facts, event-sourced"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
keywords = ["memory", "ai-agent", "semantic-search", "knowledge-graph", "event-sourcing"]
categories = ["database", "science"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.34", features = ["bundled-full"] }
blake3 = "1"
tracing = "0.1"
petgraph = "0.7"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros"], optional = true }
hnsw = { version = "0.11", optional = true }
space = { version = "0.17", optional = true }
rand = { version = "0.8", features = ["small_rng"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
rand = { version = "0.8", features = ["small_rng"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["yaml"] }
proptest = "1"

[[bench]]
name = "search_bench"
harness = false

[features]
default = []
async = ["dep:tokio"]
ann = ["dep:hnsw", "dep:space", "dep:rand"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
