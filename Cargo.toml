[workspace]
resolver = "3"
members = [
    "crates/me-types",
    "crates/me-traits",
    "crates/me-storage",
    "crates/me-index",
    "crates/me-backend-sqlite",
    "crates/me-backend-postgres",
    "crates/me-test-support",
    "crates/me-forget",
    "crates/me-resolve",
    "crates/me-ingest",
    "crates/me-query",
    "crates/me-archive",
    "crates/me-consolidate",
    "crates/me-cognitive",
    "crates/memory-engine",
    "crates/memory-engine-embed",
    "crates/memory-engine-cli",
    "crates/memory-engine-mcp",
]
# `fuzz` is its own detached workspace (cargo-fuzz, nightly-only). `.worktrees` holds
# scratch git worktrees. Neither is a member here.
exclude = [".worktrees", "fuzz"]

# Workspace MSRV — the single source of truth: every member inherits it
# (`rust-version.workspace = true`) and the CI "verify rust-version" job greps it from
# here (`grep '^rust-version' Cargo.toml`). Only the detached `fuzz/` workspace repeats it.
# 1.89 is rusqlite 0.41+'s `rust-version`, taken for RUSTSEC-2026-0459.
[workspace.package]
rust-version = "1.89"

# Shared lint policy (Wave 2 #816): the panic-safety (#725) + `unsafe_code = "forbid"`
# gates live here once and every library crate inherits them with
# `[lints] workspace = true`. The binaries `memory-engine-cli` and `memory-engine-mcp` keep
# their own table without `unwrap_used`, which guards a consumer's process; Cargo cannot
# inherit a table minus one lint, so they do not follow edits here.
[workspace.lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set only by `cargo fuzz` (`--cfg fuzzing`) and gates the fuzz seams.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Embedded-library panic-safety gate (#725): an `.unwrap()` in a production path
# aborts the *consumer's* process, so it is denied in library code. A crate's unit tests
# opt out at its root with `#![cfg_attr(test, allow(clippy::unwrap_used))]`; integration
# tests, benches and examples with a file-local `#![allow(clippy::unwrap_used)]`.
# `expect("documented invariant")` stays allowed.
unwrap_used = "deny"

# `[profile.*]` is honoured ONLY in the workspace-root manifest of a virtual workspace
# (Cargo ignores — with a warning — any profile set in a member). Moved here verbatim
# from the former root package manifest when it became this virtual root.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
