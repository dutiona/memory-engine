[workspace]
resolver = "3"
members = [
    "memory-engine/lib/memory-engine",
    "memory-engine/lib/embed",
    "memory-engine/bin/cli",
    "memory-engine/bin/mcp",
]
# `fuzz` is its own detached workspace (cargo-fuzz, nightly-only). `.worktrees` holds
# scratch git worktrees. Neither is a member here.
exclude = [".worktrees", "fuzz"]

# Workspace MSRV — the single source of truth the CI "verify rust-version" job greps
# from this root manifest (`grep '^rust-version' Cargo.toml`). Members keep their own
# `rust-version = "1.88"`; this also lets future crates inherit via
# `rust-version.workspace = true`.
[workspace.package]
rust-version = "1.88"

# `[profile.*]` is honoured ONLY in the workspace-root manifest of a virtual workspace
# (Cargo ignores — with a warning — any profile set in a member). Moved here verbatim
# from the former root package manifest when it became this virtual root.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
