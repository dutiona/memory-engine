[workspace]
members = ["memory-engine-cli", "memory-engine-embed", "memory-engine-mcp"]
exclude = [".worktrees"]

[package]
name = "memory-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Embedded memory engine for autonomous AI agents — hybrid search, bi-temporal facts, event-sourced"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
keywords = ["memory", "ai-agent", "semantic-search", "knowledge-graph", "event-sourcing"]
categories = ["database", "science"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.34", features = ["bundled"] }
blake3 = "1"
rmp-serde = "1"
tempfile = "3"
tracing = "0.1"
petgraph = "0.7"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros"], optional = true }
hnsw = { version = "0.11", optional = true }
space = { version = "0.17", optional = true }
rand = { version = "0.8", features = ["small_rng"], optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["yaml", "redactions"] }
proptest = "1"

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "lifecycle_bench"
harness = false

[features]
default = []
async = ["dep:tokio"]
ann = ["dep:hnsw", "dep:space", "dep:rand"]
compress-gzip = ["dep:flate2"]
compress-zstd = ["dep:zstd"]
archive = ["compress-zstd"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
