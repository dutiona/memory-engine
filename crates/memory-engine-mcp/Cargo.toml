[package]
name = "memory-engine-mcp"
version = "0.2.0-rc.3"
edition = "2024"
rust-version.workspace = true
description = "MCP server for memory-engine — exposes agent memory as MCP tools over streamable HTTP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Binary application, not a published library: `publish = false` states that intent and
# (being private) lets its version-less intra-workspace path deps pass cargo-deny's
# wildcard check — `allow-wildcard-paths` applies only to private crates.
publish = false

[lib]
name = "memory_engine_mcp"
path = "src/lib.rs"

[[bin]]
name = "memory-engine-mcp"
path = "src/main.rs"

[dependencies]
memory-engine = { path = "../memory-engine" }
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
memory-engine-embed = { path = "../memory-engine-embed" }
# The plugin-store readers open SQLite store copies.
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
sha2 = "0.11"
subtle = "2"
# Call IDs (ADR-0020 §8); already in the lock through other crates.
getrandom = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
