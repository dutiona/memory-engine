[package]
name = "memory-engine-embed"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "HTTP embedding provider for memory-engine — OpenAI and Ollama compatible"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Not published during the Wave 2 decomposition (#816): this crate depends on the
# now-publish=false `memory-engine` facade (which in turn path-depends on the publish=false
# leaf crates), so it cannot be published to crates.io until the split stabilizes (Codex,
# PR #928). publish=false keeps the workspace consistent; revisit at Wave 2 completion.
publish = false

[dependencies]
# Bare path-dep: with this crate publish=false, cargo-deny's `allow-wildcard-paths`
# exempts the first-party path dep, so the `version` key a publishable crate would have
# needed is dropped.
memory-engine = { path = "../memory-engine" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set only by cargo-fuzz (`--cfg fuzzing`); it gates the
# `fuzz_seam` module. Register it so the normal build does not warn on the
# otherwise-unknown cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
