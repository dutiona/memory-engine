[package]
name = "memory-engine-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI inspector for memory-engine — operator tool for querying, inspecting, and managing agent memory"
license = "MIT OR Apache-2.0"
# Binary application, not a published library: `publish = false` states that intent and
# (being private) lets its version-less intra-workspace path deps pass cargo-deny's
# wildcard check — `allow-wildcard-paths` applies only to private crates.
publish = false

[[bin]]
name = "memory-engine-cli"
path = "src/main.rs"

[dependencies]
memory-engine = { path = "../memory-engine", features = ["compress-gzip", "compress-zstd"] }
memory-engine-embed = { path = "../memory-engine-embed" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
tabled = "0.20"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled"] }
# Direct runtime dep for the Stage E cutover (`#[tokio::main]`/`block_on` at the
# command boundary). Already present transitively via memory-engine's default
# `async`; named here so the cutover can use it directly. (#631 Stage D)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
