# cargo-fuzz crate for memory-engine — DELIBERATELY OUTSIDE the main workspace.
#
# The empty `[workspace]` table below detaches this package from the parent
# workspace so that `cargo build --workspace --all-features` at the repo root
# never compiles it. The fuzz targets require the nightly-only libFuzzer
# sanitizer runtime (`-Z sanitizer`, `--cfg fuzzing`); pulling them into the
# default members would force nightly on the stable main build. Build/run with:
#
#     cargo +nightly fuzz build
#     cargo +nightly fuzz run <target>
#
# The seam they drive (`fuzz_seam` in memory-engine / memory-engine-embed) is
# `#[cfg(fuzzing)]`-gated, so it exists only under cargo-fuzz's `--cfg fuzzing`.
#
# `fuzz/Cargo.lock` is committed (#1093), so the fuzz build never floats to fresh releases.
# cargo-fuzz has no `--locked`, so the gate runs, BEFORE `fuzz build` (which would rewrite a
# stale lock silently):
#
#     cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml
#
# It fails whenever a manifest fuzz/ reaches changes: every workspace version bump (each
# release) and every dependency added, removed or moved in the facade, -embed or -mcp. Then
# re-seed from the workspace lock, so the crates both graphs share keep the versions the
# workspace tests, and commit fuzz/Cargo.lock with the change:
#
#     cp Cargo.lock fuzz/Cargo.lock && cargo +nightly fetch --manifest-path fuzz/Cargo.toml
#
# `cargo deny check` audits the root lock only, not this one.
[package]
name = "memory-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The root workspace MSRV, repeated: a detached workspace cannot inherit it.
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
# `dispatch` is `async`; the dispatch target drives it on a reused
# current-thread runtime, so only the `rt` feature is needed.
tokio = { version = "1", features = ["rt"] }

# Exercise the compressed-snapshot and HNSW restore branches as well as the
# plain path, so the snapshot/restore targets cover every deserialization route.
memory-engine = { path = "../crates/memory-engine", features = ["ann", "compress-gzip", "compress-zstd", "archive"] }
memory-engine-embed = { path = "../crates/memory-engine-embed" }
# Drives the MCP tool dispatcher (`MemoryMcpServer::dispatch`), the server's primary
# untrusted-input entry point (#321), the lifecycle route's seam
# (`MemoryMcpServer::record_lifecycle`, #1025), and the backfill upload seam
# (`MemoryMcpServer::import_upload`, #1120).
memory-engine-mcp = { path = "../crates/memory-engine-mcp" }
# The header map the dispatch, lifecycle_event and backfill_upload targets build their headers from; the version
# axum 0.8 uses, so `ProjectFacts::from_headers` and `Envelope::from_headers` take it as is.
http = "1"

# Detach from the parent workspace: an empty `[workspace]` makes this its own
# workspace root, so the repo-root `cargo build --workspace` ignores it.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "snapshot_load"
path = "fuzz_targets/snapshot_load.rs"
test = false
doc = false
bench = false

