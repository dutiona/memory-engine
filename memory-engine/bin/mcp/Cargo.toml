[package]
name = "memory-engine-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server for memory-engine — exposes agent memory as MCP tools over stdio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"

[lib]
name = "memory_engine_mcp"
path = "src/lib.rs"

[[bin]]
name = "memory-engine-mcp"
path = "src/main.rs"

[[test]]
name = "tools"
path = "tests/tools.rs"

[dependencies]
memory-engine = { path = "../../lib/memory-engine" }
rmcp = { version = "1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
memory-engine-embed = { path = "../../lib/embed" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.34", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"

[dev-dependencies]
blake3 = "1"
wiremock = "0.6"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
