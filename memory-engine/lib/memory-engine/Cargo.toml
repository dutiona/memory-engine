[package]
name = "memory-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Embedded memory engine for autonomous AI agents — hybrid search, bi-temporal facts, event-sourced"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
keywords = ["memory", "ai-agent", "semantic-search", "knowledge-graph", "event-sourcing"]
categories = ["database", "science"]
# Not published during the Wave 2 decomposition (#816): the facade path-depends on the
# publish=false leaf crates (me-types/me-traits/me-storage), so a `cargo publish` would
# resolve them as non-existent registry deps (Codex, PR #928). Marking the facade
# publish=false keeps the workspace internally consistent while the leaf boundaries are
# still moving across S2–S6; the real publishing strategy is decided at Wave 2 completion.
publish = false
# Tests, benches, and examples live at the REPO TOP LEVEL — ../../../{tests,benches,
# examples} — not under this crate dir, so Cargo auto-discovery finds nothing and each
# target is attached explicitly by `path` below (the bin/lib layout reorg).
autotests = false
autobenches = false
autoexamples = false

[dependencies]
# Internal L0/L0.5/L1 crates (Wave 2 #816). Bare path-deps: now that the facade is
# publish=false, cargo-deny's `allow-wildcard-paths` exempts first-party path deps of
# private crates, so the `version` keys that a publishable facade would have required
# (plan §D.1) are dropped — matching the leaf-crate convention.
me-types = { path = "../me-types" }
me-traits = { path = "../me-traits" }
me-storage = { path = "../me-storage" }
# L2 in-memory projections (MemoryGraph + ScopeTree), backend-free (Wave 2 #816 / S2).
me-index = { path = "../me-index" }
# L2 SQLite persistence leaves (store + connection pool), Wave 2 #816 / S2 sub-PR 2a.
me-backend-sqlite = { path = "../me-backend-sqlite" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.34", features = ["bundled"] }
blake3 = "1"
rmp-serde = "1"
tempfile = "3"
tracing = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
hnsw = { version = "0.11", optional = true }
space = { version = "0.17", optional = true }
rand = { version = "0.8", features = ["small_rng"], optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
# PostgreSQL backend (#633), pulled only by `backend-postgres`. `default-features =
# false` drops tokio-postgres's TLS/`whoami` (BSL-1.0) fallback — #633 binds no data,
# so the `with-chrono-0_4`/`with-serde_json-1` type-mapping features are deferred to
# #634. The `vector(N)`/`pgvector` Rust crate is deferred to #635 (raw DDL needs no crate).
tokio-postgres = { version = "0.7", default-features = false, optional = true }
deadpool-postgres = { version = "0.14", optional = true }

# `libc::O_NOFOLLOW` for the symlink-safe dump open (#296/#354/#414). Unix-only;
# already in the dependency graph transitively, so this adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `trace`: additive, zero-runtime-cost rusqlite feature (compiles in
# `Connection::trace`); used ONLY by the ANN batched-fetch round-trip count test
# (#288/#362). Cargo feature-unifies this dev entry into the test build only, so
# the shipped library (and crates linking it) never enables `trace`. No new crates.
rusqlite = { version = "0.34", features = ["trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["yaml", "redactions"] }
proptest = "1"
# Live-PG harness (#633): the gated `storage::postgres` tests spin a throwaway
# Postgres (the `pgvector/pgvector` image, for `CREATE EXTENSION vector`). Dev-only,
# but still license-scanned by `cargo deny` (graph all-features = true). Every PG test
# is `#[ignore]` so `cargo test --all-features` stays green without a Docker daemon.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# Force these leaf crates' `test-util` feature ON for every `cargo test` of this
# crate, regardless of whether `--features test-util` was passed explicitly
# (Wave 2 #816, me-backend-sqlite carve, Commit 2): `crate::test_utils` re-exports
# their `test-util`-gated helpers, and many plain `#[cfg(test)]`-only call sites
# (consolidation/, engine/, inspect/, search/) must keep compiling under a bare
# `cargo test -p memory-engine` with no feature flags, matching today's baseline.
me-types = { path = "../me-types", features = ["test-util"] }
me-traits = { path = "../me-traits", features = ["test-util"] }

[[bench]]
name = "search_bench"
path = "../../../benches/search_bench.rs"
harness = false

[[bench]]
name = "lifecycle_bench"
path = "../../../benches/lifecycle_bench.rs"
harness = false

# --- integration tests (top-level ../../../tests/) — attached explicitly since this
#     crate dir has no tests/ subdir for Cargo to auto-discover ---
# The two-tier eval harness (#16): a multi-file binary rooted at tests/eval/main.rs.
# Cargo auto-discovered it when the repo root was a package; after the bin/lib
# restructure the core crate's dir has no tests/ subdir, so it must be attached
# explicitly like every other top-level integration test below -- otherwise the
# whole conformance + quality suite silently stops building under `cargo test`.
[[test]]
name = "eval"
path = "../../../tests/eval/main.rs"

[[test]]
name = "activity_stream_test"
path = "../../../tests/activity_stream_test.rs"

[[test]]
name = "ann_recall_test"
path = "../../../tests/ann_recall_test.rs"

[[test]]
name = "archive_test"
path = "../../../tests/archive_test.rs"

[[test]]
name = "bootstrap_dryrun"
path = "../../../tests/bootstrap_dryrun.rs"

[[test]]
name = "bootstrap_memory_dir"
path = "../../../tests/bootstrap_memory_dir.rs"

[[test]]
name = "bootstrap_test"
path = "../../../tests/bootstrap_test.rs"

[[test]]
name = "dream_cycle_test"
path = "../../../tests/dream_cycle_test.rs"

[[test]]
name = "inspect_test"
path = "../../../tests/inspect_test.rs"

[[test]]
name = "phase3b_lifecycle_test"
path = "../../../tests/phase3b_lifecycle_test.rs"

[[test]]
name = "read_only_test"
path = "../../../tests/read_only_test.rs"

[[test]]
name = "recent_insights_test"
path = "../../../tests/recent_insights_test.rs"

[[test]]
name = "restore_roundtrip_test"
path = "../../../tests/restore_roundtrip_test.rs"

[[test]]
name = "roundtrip_test"
path = "../../../tests/roundtrip_test.rs"

[[test]]
name = "all_features_store"
path = "../../../tests/all_features_store.rs"

# --- examples (top-level ../../../examples/) ---
[[example]]
name = "basic_roundtrip"
path = "../../../examples/basic_roundtrip.rs"

[[example]]
name = "bi_temporal_query"
path = "../../../examples/bi_temporal_query.rs"

[[example]]
name = "custom_traits"
path = "../../../examples/custom_traits.rs"

# The engine is async-native (#631): its DB-touching methods are `async fn` that
# await an `Arc<dyn StorageBackend>`, so a tokio runtime is mandatory — `tokio` is a
# non-optional dependency and there is no `async` feature to toggle (#702). The
# remaining flags are genuinely optional capabilities.
[features]
# At least one storage backend must be enabled — enforced by a `compile_error!` in
# `lib.rs`. SQLite is the default; Postgres (#633) is opt-in.
default = ["backend-sqlite"]
ann = ["dep:hnsw", "dep:space", "dep:rand"]
compress-gzip = ["dep:flate2"]
compress-zstd = ["dep:zstd"]
# Forwards to `me-types/archive` so `QueryDiagnostics`'s `#[cfg(feature = "archive")]`
# fields (types::search, now in me-types) compile in step with the facade (plan §D.2).
# Also forwards to `me-index/archive` (Wave 2 #816 / S2) so `MemoryGraph::remove_node`
# — `#[cfg(any(feature = "archive", test))]`-gated in me-index, called by
# `engine/archive.rs`'s own `#[cfg(feature = "archive")]` prune path — is compiled in
# lockstep with the facade's `archive` feature. Also forwards to
# `me-backend-sqlite/archive` (Wave 2 #816 / S2, sub-PR 2a) so
# `store/archive_manifest.rs` compiles in lockstep too.
archive = [
    "compress-zstd",
    "me-types/archive",
    "me-storage/archive",
    "me-index/archive",
    "me-backend-sqlite/archive",
]
# The default in-process SQLite backend. NOTE (#633): this is a *marker* feature — it
# does NOT yet gate `mod sqlite` or `rusqlite`. The engine open path hardcodes
# `SqliteBackend` (`engine::init_from_pool`), so a true PG-only build is not
# achievable until engine-selects-backend lands. The feature exists so the
# `compile_error!(neither backend)` guard has a stable predicate and so the future
# PG-only build can move `rusqlite` behind `dep:rusqlite` here without a guard change.
# `rusqlite` stays an unconditional dependency for now.
backend-sqlite = []
# The PostgreSQL backend (#633): `deadpool-postgres` pool + a fresh v14 migration
# chain + the `SchemaManager` impl. Data CRUD is #634; lexical+vector search and the
# conformance-arm flip are #635. With the feature on, `mod storage::postgres` compiles
# and the conformance battery's `postgres` arm is discovered-but-ignored (`PgFactory`
# stays `todo!()` until #635).
backend-postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
# Exposes test-only escape hatches on the storage port (e.g.
# `SchemaManager::raw_exec`) for cross-crate tests — notably the #632 conformance
# suite, where every backend must provide the seam for the failure-injection
# tests to run. Always active for this crate's own `#[cfg(test)]` builds; not part
# of the public API surface and never enabled in release builds. Forwards to
# `me-types`/`me-traits` (Wave 2 #816, me-backend-sqlite carve, Commit 2) so a
# downstream consumer building with `--features test-util` also gets the shared
# `NewFact`/`NewEvent`/`MockEmbedder` test doubles those crates now own.
test-util = ["me-storage/test-util", "me-types/test-util", "me-traits/test-util"]

[lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set only by cargo-fuzz (`--cfg fuzzing`); it gates the
# `fuzz_seam` module. Register it so the normal build does not warn on the
# otherwise-unknown cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Embedded-library panic-safety gate (#725): an `.unwrap()` in a production path
# aborts the *consumer's* process, so it is denied in library code. Test code,
# benches, and examples opt out with a justified, file-local
# `#![allow(clippy::unwrap_used)]`; forgetting it red-builds, which is the point.
# `expect("documented invariant")` is the sanctioned escape hatch and stays allowed.
unwrap_used = "deny"
