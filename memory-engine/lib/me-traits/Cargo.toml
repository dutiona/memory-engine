[package]
name = "me-traits"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Consumer/contract traits for the memory-engine workspace (Wave 2 #816)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
publish = false

[dependencies]
me-types = { path = "../me-types" }
async-trait = "0.1"

[dev-dependencies]
# The trait object-safety tests construct a `ClassifierInput` whose `metadata`
# field is a `serde_json::Value` (a me-types type). Test-only.
serde_json = "1.0"

[features]
# Exposes the shared `MockEmbedder` test double (Wave 2 #816, me-backend-sqlite
# carve, Commit 2) to every consumer crate's own tests, cross-crate (`#[cfg(test)]`
# does not reach across a crate boundary — only a Cargo feature does).
test-util = []

[lints]
workspace = true
