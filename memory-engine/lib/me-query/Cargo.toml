[package]
name = "me-query"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Query primitive: hybrid FTS5 + vector + RRF retrieval over MemoryCtx (Wave 2 #816 / S4, sub-PR 2)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Workspace-internal crate: never published, so it uses bare path-deps and is exempt
# from cargo-deny's published-crate wildcard rule (plan §D.1).
publish = false

[dependencies]
me-types = { path = "../me-types" }
me-traits = { path = "../me-traits" } # Reranker + SearchResult vocab
me-storage = { path = "../me-storage" } # StorageBackend port, SearchIndex, MemoryCtx, FactFilter/TemporalFilter
me-index = { path = "../me-index" } # ScopeTree
chrono = "0.4"
parking_lot = "0.12"
# `spawn_blocking` for the reranker offload in `query()` — matches me-ingest's own
# runtime feature set (not `rt-multi-thread`, which sibling crates only pull in as a
# dev-dependency for their test harness).
tokio = { version = "1", features = ["rt"] }
# `assemble_results`'s failed-to-load-fact warning (moved verbatim from the facade).
tracing = "0.1"

[features]
# `MemoryQuery::include_archives` (moved from the facade's `search/query.rs`) is
# `#[cfg(feature = "archive")]`-gated; forward so `--all-features` compiles it. No
# other moved item touches an archive-gated field.
archive = ["me-types/archive"]

[dev-dependencies]
# Backend harness for the re-pointed behavior tests (XR-4d) — they exercise the
# live port_hybrid_search against a real SqliteBackend.
me-test-support = { path = "../me-test-support" }
me-backend-sqlite = { path = "../me-backend-sqlite" }
# `me_types::test_util::{new_fact, new_fact_with_type}` fixtures the re-pointed
# behavior tests need (distinct per-fact embeddings/fact_types the me-test-support
# `fixtures::new_fact` helper doesn't parametrize). Mirrors the facade's own
# `[dev-dependencies] me-types = { ..., features = ["test-util"] }` forward.
me-types = { path = "../me-types", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `MemoryQuery`'s rustdoc example (moved verbatim from the facade's `search/query.rs`)
# demonstrates the type through its intended public path, `memory_engine::MemoryQuery`
# — a dev-only cycle back to the facade. Cargo permits dependency cycles through
# dev-dependencies (they are not part of the crate's own build graph, only its test/
# doctest targets), so this does not make `me-query`'s library artifact depend on the
# facade.
memory-engine = { path = "../memory-engine" }
proptest = "1"
serde_json = "1.0"

[lints]
workspace = true
