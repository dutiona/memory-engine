[package]
name = "me-cognitive"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Cognitive/dream-cycle primitive: Phase 5a DreamCycle orchestration over MemoryCtx + the DreamCtx capability trait (Wave 2 #816 / S5, sub-PR 2)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Workspace-internal crate: never published, so it uses bare path-deps and is exempt
# from cargo-deny's published-crate wildcard rule (plan §D.1).
publish = false

[dependencies]
me-types = { path = "../me-types" }
# `DreamCtx`/`CycleCtx` (the capability traits `CycleContext` implements) +
# `SummaryGenerator`/`EmbeddingProvider`/`ConsolidationConfig`/`ConsolidationStats`
# (named in `DreamCtx`'s signature) + `DreamCycle`/`DeltaProposer`.
me-traits = { path = "../me-traits" }
# `MemoryCtx` (the universal capability handle every free fn here takes) +
# `UpcasterRegistry` (`apply_cycle_report`'s atomic-apply dependency).
me-storage = { path = "../me-storage" }
# `MemoryGraph`/`EdgeData` — `apply_cycle_report` mirrors supersede edges into the
# in-memory graph, and the orchestration free fns thread `&RwLock<MemoryGraph>`
# through from the facade, mirroring `me-consolidate`/`me-forget`/`me-resolve`.
me-index = { path = "../me-index" }
async-trait = "0.1"
chrono = "0.4"
# `RwLock<MemoryGraph>` — the graph handle `apply_cycle_report` takes as an explicit
# parameter (`MemoryCtx` carries no graph state), mirroring every other L3 primitive.
parking_lot = "0.12"
# `spawn_blocking` for `LlmDreamCycle`'s consumer `propose`/`embed` IO offload (#554).
tokio = { version = "1", features = ["rt"] }
# `dbscan`'s over-cap skip warning (moved verbatim from the facade).
tracing = "0.1"
# `build_cycle_context`'s `dream_cycle_history` config-value (de)serialization.
serde_json = "1.0"

[dev-dependencies]
# The moved `#[cfg(test)]` suites (`apply.rs`, `default_impl.rs`, `llm_impl.rs`) drive
# a real backend directly (`SqliteFactory::make()`), mirroring `me-consolidate`'s own
# dev-dependency on this crate — not a production edge.
me-backend-sqlite = { path = "../me-backend-sqlite" }
me-test-support = { path = "../me-test-support" }
# `MockEmbedder` (`me_traits::test_util`), used by the moved `LlmDreamCycle` tests.
me-traits = { path = "../me-traits", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"

[lints]
workspace = true
