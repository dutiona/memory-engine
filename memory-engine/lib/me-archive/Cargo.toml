[package]
name = "me-archive"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Archive primitive: `.pak` cold-storage compaction over MemoryCtx + ColdStorage (Wave 2 #816 / S4, sub-PR 3b)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Workspace-internal crate: never published, so it uses bare path-deps and is exempt
# from cargo-deny's published-crate wildcard rule (plan §D.1).
publish = false

[dependencies]
# ⚠️ WORKSPACE FEATURE UNIFICATION. This crate is the first workspace member to enable a
# sibling's optional feature *unconditionally* (every other crate declares its own optional
# `archive` feature and forwards). That is correct here — me-archive IS the archive
# primitive and cannot compile without these — but it has a non-obvious consequence: since
# me-archive is an unconditional `[workspace] members` entry, Cargo unifies features across
# a `--workspace` build, so me-types/me-storage/me-index compile with `archive` ON in EVERY
# workspace job, including `cargo build --workspace` (default features).
#
# Left alone, that would mean NO CI job compiles those three crates archive-OFF — the very
# configuration a downstream consumer of `memory-engine` gets by default. The CI Build job
# therefore also runs facade-alone `cargo check -p memory-engine` (default and
# no-default-features), which narrows the graph to exclude me-archive and restores the
# archive-OFF gate. Do not delete those steps as "redundant with --workspace" — they are not.
#
# `archive` forwards to `me_types::types::archive` (ArchiveManifestEntry,
# ARCHIVE_SCHEMA_VERSION) — the module is itself feature-gated in me-types.
me-types = { path = "../me-types", features = ["archive"] }
# `archive` gates the `ColdStorage` port trait this crate's orchestration layer
# (manage.rs) consumes.
me-storage = { path = "../me-storage", features = ["archive"] }
# `archive` gates `MemoryGraph::remove_node` (the post-commit graph prune,
# manage.rs's `archive()`); `remove_edges_by_fact` is unconditional.
me-index = { path = "../me-index", features = ["archive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
blake3 = "1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
