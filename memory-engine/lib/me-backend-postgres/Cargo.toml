[package]
name = "me-backend-postgres"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "PostgreSQL persistence backend for the memory-engine workspace (Wave 2 #816 / S2, sub-PR 3)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"
# Workspace-internal crate: never published, so it uses bare path-deps and is exempt
# from cargo-deny's published-crate wildcard rule (plan §D.1).
publish = false

[dependencies]
me-types = { path = "../me-types" }
me-storage = { path = "../me-storage" }
async-trait = "0.1"
# The PostgreSQL backend (#633 skeleton, carved Wave 2 #816 / S2 sub-PR 3).
# `default-features = false` drops tokio-postgres's TLS/`whoami` (BSL-1.0) fallback —
# #633 binds no data, so the `with-chrono-0_4`/`with-serde_json-1` type-mapping
# features are deferred to #634. The `vector(N)`/`pgvector` Rust crate is deferred to
# #635 (raw DDL needs no crate).
tokio-postgres = { version = "0.7", default-features = false }
deadpool-postgres = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Live-PG harness (#633): the gated `tests` module spins up a throwaway Postgres (the
# `pgvector/pgvector` image, for `CREATE EXTENSION vector`). Dev-only, but still
# license-scanned by `cargo deny` (graph all-features = true). Every PG test is
# `#[ignore]` so `cargo test --all-features` stays green without a Docker daemon.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[features]
# Exposes `SchemaManager::raw_exec` (the test-only failure-injection escape hatch) so
# the live-PG `tests` suite can drive it. Forwards to `me-storage/test-util` since the
# trait method itself is `#[cfg(feature = "test-util")]`-gated there (a cross-crate
# trait method can't ride bare `cfg(test)`) — without the forward, `impl SchemaManager
# for PgBackend` would not satisfy the trait when this crate alone builds with
# `test-util` (Cargo features are per-crate, not implicitly transitive).
test-util = ["me-storage/test-util"]

[lints]
workspace = true
