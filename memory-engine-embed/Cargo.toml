[package]
name = "memory-engine-embed"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "HTTP embedding provider for memory-engine — OpenAI and Ollama compatible"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutiona/memory-engine"

[dependencies]
memory-engine = { path = ".." }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
